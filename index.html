<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Parqueadero Bandera Center</title>
<style>
  /* ============================================================
     RESET + BASE
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #111111;
    --primary-soft: #1e1e1e;
    --accent: #FFCC00;
    --accent-hover: #FBC02D;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #d1d5db;
    --text: #0a0a0a;
    --text-muted: #4b5563;
    --text-soft: #6b7280;
    --header-bg: #111111;
    --header-text: #ffffff;
    --nav-bg: #111111;
    --nav-text: #ffffff;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --radius: 18px;
    --radius-sm: 14px;
    --shadow: 0 3px 10px rgba(0,0,0,.08);
    --shadow-lg: 0 14px 36px rgba(0,0,0,.22);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --transition: .22s ease;
    --tap: 60px;
  }

  body.dark-mode {
    --primary: #f5f5f5;
    --primary-soft: #e5e5e5;
    --bg: #121212;
    --surface: #1e1e1e;
    --border: #333333;
    --text: #f5f5f5;
    --text-muted: #b0b0b0;
    --text-soft: #888888;
    --header-bg: #000000;
    --header-text: #f5f5f5;
    --nav-bg: #000000;
    --nav-text: #f5f5f5;
    --danger: #f87171;
    --danger-bg: #450a0a;
    --success: #4ade80;
    --success-bg: #052e16;
    --warn: #fbbf24;
    --warn-bg: #451a03;
    --shadow: 0 3px 10px rgba(0,0,0,.4);
    --shadow-lg: 0 14px 36px rgba(0,0,0,.6);
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: #e5e7eb;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    font-size: 18px;
    line-height: 1.55;
    transition: background .3s ease, color .3s ease;
  }

  body.dark-mode { background: #0a0a0a; }

  .app {
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background .3s ease;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; touch-action: manipulation; }
  input, textarea { font-family: inherit; font-size: 20px; }

  .header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: var(--shadow);
    transition: background .3s ease, color .3s ease;
  }
  .header-brand { display: flex; align-items: center; gap: 14px; }
  .header-logo {
    background: var(--accent);
    color: #111111;
    width: 54px; height: 54px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .3s ease;
  }
  .header-logo svg { width: 30px; height: 30px; }
  .header-title { font-size: 22px; font-weight: 800; line-height: 1.15; letter-spacing: -.3px; }
  .header-sub { font-size: 15px; font-weight: 600; color: var(--accent); margin-top: 3px; transition: color .3s ease; }
  .btn-menu {
    color: var(--accent);
    padding: 12px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: color var(--transition);
    min-width: var(--tap); min-height: var(--tap);
  }
  .btn-menu:hover { opacity: .8; }
  .btn-menu svg { width: 34px; height: 34px; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity var(--transition);
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0;
    width: 400px; max-width: 85vw; height: 100%;
    background: #111111;
    color: #fff;
    z-index: 60;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.22,.61,.36,1);
    box-shadow: -8px 0 30px rgba(0,0,0,.28);
  }
  .drawer.active { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 26px;
    border-bottom: 1px solid #2a2a2a;
    background: rgba(0,0,0,.3);
  }
  .drawer-head h2 { color: var(--accent); font-size: 24px; font-weight: 800; }
  .drawer-close {
    color: #aaa; padding: 10px;
    transition: color var(--transition);
    min-width: 52px; min-height: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .drawer-close:hover { color: #fff; }
  .drawer-close svg { width: 28px; height: 28px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 14px 0; }
  .drawer-item {
    display: flex; align-items: center; gap: 18px;
    width: 100%; padding: 22px 30px;
    font-size: 19px; font-weight: 600; text-align: left;
    border-left: 5px solid transparent;
    transition: all var(--transition);
    min-height: 68px;
    color: #fff;
  }
  .drawer-item:hover { background: #1e1e1e; border-left-color: var(--accent); }
  .drawer-item svg { color: var(--accent); flex-shrink: 0; width: 28px; height: 28px; }
  .drawer-foot { padding: 20px; font-size: 15px; text-align: center; color: #888; border-top: 1px solid #2a2a2a; }

  .main { flex: 1; padding: 28px 28px; padding-bottom: 130px; overflow-y: auto; width: 100%; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    width: 100%;
    background: var(--nav-bg);
    color: var(--nav-text);
    display: flex; justify-content: space-around; align-items: center;
    height: 96px;
    border-top: 1px solid var(--border);
    z-index: 30;
    box-shadow: 0 -3px 14px rgba(0,0,0,.18);
    transition: background .3s ease;
  }
  .nav-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 10px 0;
    color: #999;
    font-size: 14px; font-weight: 700;
    transition: color var(--transition);
    height: 100%; min-height: var(--tap);
  }
  .nav-btn svg { width: 32px; height: 32px; }
  .nav-btn:hover { color: var(--accent); }
  .nav-btn.active { color: var(--accent); }

  .section-head { margin-bottom: 22px; }
  .section-title {
    font-size: 28px; font-weight: 800;
    display: flex; align-items: center; gap: 12px;
    letter-spacing: -.5px; line-height: 1.2;
  }
  .section-title svg { width: 30px; height: 30px; }
  .section-sub { font-size: 17px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    margin-bottom: 22px;
    transition: background .3s ease, border-color .3s ease;
  }

  .empty-state {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    padding: 52px 26px;
    text-align: center;
    margin-top: 22px;
    transition: background .3s ease;
  }
  .empty-icon {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--success-bg);
    color: var(--success);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .empty-icon svg { width: 46px; height: 46px; }
  .empty-title { font-weight: 800; font-size: 24px; color: var(--text); }
  .empty-sub { font-size: 17px; color: var(--text-muted); margin-top: 8px; }

  .alert-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border-left: 6px solid var(--danger);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 14px;
    transition: background .3s ease;
  }
  .alert-card .plate { font-weight: 800; font-size: 22px; letter-spacing: .8px; color: var(--text); }
  .alert-card .customer-name {
    font-size: 13px; font-weight: 800;
    padding: 4px 12px; border-radius: 999px;
    background: var(--border); color: var(--text);
    margin-left: 10px; letter-spacing: .3px;
  }
  .alert-card .alert-msg { font-size: 16px; color: var(--danger); font-weight: 700; margin-top: 6px; }
  .alert-card .alert-sub { font-size: 15px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

  .icon-badge {
    width: 64px; height: 64px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-badge svg { width: 32px; height: 32px; }
  .icon-badge.danger { background: var(--danger-bg); color: var(--danger); }
  .icon-badge.neutral { background: var(--border); color: var(--text); }

  .vehicle-toggle { display: flex; gap: 12px; margin: 12px 0 22px; }
  .vehicle-toggle button {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    padding: 20px 16px;
    border-radius: var(--radius-sm);
    background: var(--border);
    color: var(--text);
    font-weight: 800; font-size: 19px;
    transition: all var(--transition);
    min-height: var(--tap);
    border: 2px solid transparent;
  }
  .vehicle-toggle button svg { width: 28px; height: 28px; }
  .vehicle-toggle button.active {
    background: var(--accent); color: #111111;
    box-shadow: var(--shadow); border-color: #111111;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block; font-size: 15px; font-weight: 800;
    color: var(--text-muted); margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .input {
    width: 100%;
    padding: 20px 22px;
    font-size: 24px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color var(--transition), background .3s ease;
    min-height: var(--tap);
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,204,0,.25); }
  .input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-soft); font-size: 18px; }
  .input-search {
    padding-left: 54px;
    font-size: 18px; letter-spacing: 1px;
    font-weight: 700; text-transform: uppercase;
  }
  .input-search::placeholder { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 16px; }

  .search-wrap { position: relative; margin-bottom: 18px; }
  .search-wrap svg {
    position: absolute; left: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-soft);
    pointer-events: none; width: 24px; height: 24px;
  }

  .btn {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; width: 100%;
    padding: 20px 18px;
    border-radius: var(--radius-sm);
    font-weight: 800; font-size: 19px;
    transition: all var(--transition);
    min-height: var(--tap);
    letter-spacing: .3px;
  }
  .btn svg { width: 24px; height: 24px; }
  .btn-primary { background: var(--text); color: var(--accent); }
  .btn-primary:hover { opacity: .9; }
  .btn-accent { background: var(--accent); color: #111111; box-shadow: var(--shadow); }
  .btn-accent:hover { opacity: .9; }
  .btn-ghost { background: var(--border); color: var(--text); border: 2px solid var(--border); }
  .btn-ghost:hover { opacity: .8; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: .9; }
  .btn-sm { padding: 14px 22px; font-size: 17px; width: auto; border-radius: 12px; min-height: 52px; }

  .active-item {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: background .3s ease;
  }
  .active-item .meta { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
  .active-item .info { min-width: 0; }
  .active-item .plate-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .active-item .plate-line .plate { font-weight: 800; font-size: 22px; letter-spacing: .8px; color: var(--text); }
  .active-item .type-chip {
    font-size: 12px; font-weight: 800;
    padding: 4px 10px; border-radius: 6px;
    background: var(--border); color: var(--text);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .active-item .sub { font-size: 16px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

  /* Acciones en filas */
  .row-actions {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    justify-content: flex-end;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    border: 2px solid transparent;
    background: var(--border);
    color: var(--text);
    flex-shrink: 0;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:hover { opacity: .85; transform: scale(1.05); }
  .icon-btn.edit {
    background: var(--accent);
    color: #111111;
    border-color: #111111;
  }
  .icon-btn.delete {
    background: var(--danger-bg);
    color: var(--danger);
  }
  .icon-btn.delete:hover { background: var(--danger); color: #fff; }

  .table-wrap { overflow-x: auto; border-radius: var(--radius); -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 17px; min-width: 100%; }
  thead tr { background: var(--border); }
  th {
    font-size: 12px; font-weight: 800; text-transform: uppercase;
    color: var(--text); padding: 14px 8px; text-align: left;
    letter-spacing: .5px;
  }
  th.center { text-align: center; }
  th.right { text-align: right; }
  td { padding: 14px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text); }
  td.center { text-align: center; }
  td.right { text-align: right; }
  th:first-child, td:first-child { padding-left: 12px; }
  th:last-child, td:last-child { padding-right: 12px; }
  tr.row-due { background: var(--danger-bg); border-left: 6px solid var(--danger); }
  tr.row-ok { background: var(--surface); border-left: 6px solid var(--success); }
  .plate-cell { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .plate-cell .type-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: .5px; }
  .status-due { color: var(--danger); font-weight: 800; font-size: 15px; }
  .status-ok { color: var(--text); font-weight: 700; font-size: 15px; }

  .payment-day-chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; padding: 4px 8px;
    border-radius: 8px;
    background: var(--border); color: var(--text);
    font-weight: 800; font-size: 16px;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 26px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    transition: background .3s ease;
  }
  .stat-card.dark { background: var(--text); color: var(--surface); border-left: 6px solid var(--accent); }
  .stat-card .label {
    font-size: 14px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 10px;
  }
  .stat-card .label svg { width: 20px; height: 20px; }
  .stat-card .value {
    font-size: 42px; font-weight: 900;
    margin-top: 10px; color: var(--text);
    letter-spacing: -1px; line-height: 1.1;
  }
  .stat-card.dark .value { color: var(--accent); }
  .stat-card .sub { font-size: 15px; color: var(--text-soft); margin-top: 6px; font-weight: 500; }

  .modal-wrap {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 70; display: none;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-wrap.active { display: flex; }
  .modal {
    background: var(--surface);
    color: var(--text);
    border-radius: 22px;
    max-width: 520px; width: 100%;
    padding: 34px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    animation: modalIn .25s ease;
    max-height: 92vh;
    overflow-y: auto;
    transition: background .3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-icon {
    width: 78px; height: 78px;
    border-radius: 50%;
    background: var(--accent);
    color: #111111;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .modal-icon svg { width: 42px; height: 42px; }
  .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 14px; letter-spacing: -.3px; color: var(--text); }
  .modal-body { font-size: 18px; color: var(--text-muted); margin-bottom: 26px; text-align: left; line-height: 1.55; }
  .modal-body .summary-row {
    display: flex; justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 17px; gap: 14px;
  }
  .modal-body .summary-row:last-child { border-bottom: none; padding-top: 16px; margin-top: 8px; }
  .modal-body .summary-row .k { color: var(--text-muted); font-weight: 700; }
  .modal-body .summary-row .v { font-weight: 700; color: var(--text); text-align: right; }
  .modal-body .summary-row.total .v { font-size: 26px; color: var(--success); font-weight: 900; }
  .modal-footer { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .modal-footer .btn { width: auto; padding: 18px 32px; font-size: 18px; min-width: 150px; }

  /* Modal edición: form más compacto */
  .modal.edit-modal {
    max-width: 560px;
    text-align: left;
    padding: 30px;
  }
  .modal.edit-modal .modal-title {
    text-align: center;
    margin-bottom: 20px;
  }
  .modal.edit-modal .field {
    margin-bottom: 16px;
  }
  .modal.edit-modal .input {
    font-size: 20px;
    padding: 14px 16px;
    letter-spacing: 1px;
    min-height: 52px;
  }
  .modal.edit-modal .field label {
    font-size: 13px;
    margin-bottom: 6px;
  }

  .toast {
    position: fixed; bottom: 130px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--surface);
    padding: 18px 30px; border-radius: 999px;
    font-size: 18px; font-weight: 700;
    box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none;
    transition: all .3s ease;
    z-index: 80;
    white-space: nowrap; max-width: 90vw;
    overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c7ccd3; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .btn-wa {
    background: #25D366; color: #fff;
    padding: 12px; border-radius: 12px;
    min-height: 52px; min-width: 52px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    text-decoration: none; border: none; cursor: pointer;
  }
  .btn-wa:hover { background: #1ebe57; }
  .btn-wa svg { width: 26px; height: 26px; }
  .btn-wa[disabled], .btn-wa.disabled {
    background: var(--border); color: var(--text-soft);
    cursor: not-allowed; pointer-events: none;
  }

  .input-amount {
    width: 105px; max-width: 105px;
    padding: 8px 10px;
    font-size: 15px; font-weight: 800;
    letter-spacing: -.2px; text-transform: none;
    text-align: right;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface); color: var(--text);
    outline: none;
    transition: border-color var(--transition), background .3s ease;
    min-height: 44px; box-sizing: border-box;
  }
  .input-amount:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,204,0,.25); }
  .input-amount::-webkit-outer-spin-button,
  .input-amount::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .input-amount[type=number] { -moz-appearance: textfield; appearance: textfield; }

  .palette-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 14px;
    border: 3px solid transparent;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...defaultState(), ...parsed };
      if (!state.activeMonths) state.activeMonths = [];
      if (!state.history) state.history = [];
      if (!state.notifiedToday) state.notifiedToday = [];
      if (!state.settings) state.settings = defaultState().settings;
      if (!state.settings.reminderMessage) state.settings.reminderMessage = DEFAULT_MESSAGE;
    }
  } catch (e) { console.warn('Error cargando estado:', e); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn('Error guardando estado:', e); }
}

/* ==================================================================
   HELPERS
================================================================== */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtMoney(n) { return '$' + Number(n || 0).toLocaleString('es-CO'); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtTime(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDate(ts) { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function fmtDateTime(ts) { return fmtDate(ts) + ' ' + fmtTime(ts); }
function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.floor(Math.random() * 9999); }
function todayKey() { const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

function getMonthlyAmount(v) {
  if (v && v.amount != null && !isNaN(v.amount)) return Number(v.amount);
  return 0;
}

function updateMonthlyAmount(id, value) {
  const v = state.activeMonths.find(x => x.id === id);
  if (!v) return;
  const n = Number(value);
  if (value === '' || isNaN(n) || n < 0) {
    v.amount = null;
  } else {
    v.amount = n;
  }
  saveState();
  render();
}

/* ==================================================================
   LÓGICA DE VENCIMIENTO
================================================================== */
function getNextPaymentDate(v) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayMonthKey = monthKey(today);

  const paymentDay = Math.max(1, Math.min(31, Number(v.paymentDay) || 1));
  const paidThisMonth = (v.lastPaidMonth === todayMonthKey);

  let baseYear = today.getFullYear();
  let baseMonth = today.getMonth();

  if (paidThisMonth) {
    baseMonth += 1;
    if (baseMonth > 11) { baseMonth = 0; baseYear += 1; }
  }

  const maxDay = new Date(baseYear, baseMonth + 1, 0).getDate();
  const targetDay = Math.min(paymentDay, maxDay);
  return new Date(baseYear, baseMonth, targetDay, 23, 59, 59);
}

function getDaysRemaining(dueDate) {
  const now = new Date();
  const due = dueDate instanceof Date ? dueDate : new Date(dueDate);
  return Math.ceil((due - now) / (1000 * 60 * 60 * 24));
}

function getNextDueDate(v) {
  return getNextPaymentDate(v);
}

function isDueNow(v) {
  if (!v) return false;
  const today = new Date();
  const todayMonthKey = monthKey(today);
  const paymentDay = Number(v.paymentDay) || 1;

  if (v.lastPaidMonth === todayMonthKey) return false;
  if (paymentDay <= today.getDate()) return true;
  return false;
}

/* ==================================================================
   MODAL & TOAST
================================================================== */
function showModal(title, bodyHtml, iconSvg = ICONS.checkCircle, footerHtml = null, iconColor = null, extraClass = '') {
  const modal = $('#modal');
  modal.className = 'modal' + (extraClass ? ' ' + extraClass : '');
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalIcon').innerHTML = iconSvg;
  if (iconColor) $('#modalIcon').style.background = iconColor;
  else { $('#modalIcon').style.background = 'var(--accent)'; $('#modalIcon').style.color = '#111111'; }
  $('#modalFooter').innerHTML = footerHtml || `<button class="btn btn-primary" onclick="closeModal()">Aceptar</button>`;
  $('#modalWrap').classList.add('active');
}
function closeModal() { $('#modalWrap').classList.remove('active'); }

let toastTimer;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ==================================================================
   DRAWER & NAVEGACIÓN
================================================================== */
function openDrawer() { $('#drawer').classList.add('active'); $('#overlay').classList.add('active'); }
function closeDrawer() { $('#drawer').classList.remove('active'); $('#overlay').classList.remove('active'); }

function switchTab(tabId) {
  state.currentTab = tabId;
  saveState();
  $$('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabId));
  render();
}

function normalizePlate(str) {
  return String(str || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
}

/* ==================================================================
   APLICAR TEMA Y COLOR
================================================================== */
function applySettings() {
  if (state.settings.theme === 'dark') {
    document.body.classList.add('dark-mode');
  } else {
    document.body.classList.remove('dark-mode');
  }
  const accent = state.settings.accent || '#FFCC00';
  document.documentElement.style.setProperty('--accent', accent);
  const hover = adjustColor(accent, -20);
  document.documentElement.style.setProperty('--accent-hover', hover);
}

function adjustColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
}

/* ==================================================================
   RENDER PRINCIPAL
================================================================== */
function render() {
  const main = $('#main');
  const tab = state.currentTab;
  switch (tab) {
    case 'inicio':    main.innerHTML = renderInicio();    attachInicioEvents(); break;
    case 'registrar': main.innerHTML = renderRegistrar(); attachRegistrarEvents(); break;
    case 'ver':       main.innerHTML = renderVer();       attachVerEvents();   break;
    case 'config':    main.innerHTML = renderConfig();    break;
    case 'ganancias': main.innerHTML = renderGanancias(); break;
    case 'historial': main.innerHTML = renderHistorial(); break;
    case 'contacto':  main.innerHTML = renderContacto();  break;
    default:          main.innerHTML = renderInicio();    attachInicioEvents();
  }
}

            <button class="btn btn-accent btn-sm" onclick="payMonthly('${v.id}')">Pagado</button>

  if (q !== '' && dueList.length === 0 && upcomingList.length === 0) {

================================================================== */
function openEditModal(id) {
  const v = state.activeMonths.find(x => x.id === id);
  if (!v) return;

  const isMoto = v.type === 'moto';
  const selMoto = isMoto ? 'background:var(--accent);color:#111111;border-color:#111111' : '';
  const selCarro = !isMoto ? 'background:var(--accent);color:#111111;border-color:#111111' : '';
  const txt = 'background:var(--border);color:var(--text);border-color:transparent';

  const body = `
    <div class="field" style="margin-bottom:14px">
      <label>Tipo de vehículo</label>
      <div class="vehicle-toggle" style="margin:8px 0 0" data-edit-group="mes">
        <button data-type="moto" style="${isMoto ? selMoto : txt}" onclick="editSetType('moto')">${ICONS.moto}<span>Moto</span></button>
        <button data-type="carro" style="${!isMoto ? selCarro : txt}" onclick="editSetType('carro')">${ICONS.car}<span>Carro</span></button>
      </div>
    </div>

    <div class="field">
      <label>Placa</label>
      <input type="text" id="editPlate" class="input" maxlength="8" value="${escapeHtml(v.plate)}" style="text-transform:uppercase">
    </div>

    <div class="field">
      <label>Nombre del cliente</label>
      <input type="text" id="editName" class="input" maxlength="60" value="${escapeHtml(v.name || '')}" style="text-transform:none;letter-spacing:0">
    </div>

    <div class="field">
      <label>Teléfono (WhatsApp)</label>
      <input type="tel" id="editPhone" class="input" maxlength="15" value="${escapeHtml(v.phone || '')}" style="letter-spacing:1px">
    </div>

    <div class="field">
      <label>Día de pago (1 a 31)</label>
      <input type="number" id="editPaymentDay" class="input" min="1" max="31" value="${v.paymentDay || ''}" style="text-transform:none;letter-spacing:0;text-align:center">
    </div>

    <div class="field">
      <label>Monto mensual ($)</label>
      <input type="number" id="editAmount" class="input" min="0" step="100" value="${getMonthlyAmount(v)}" style="text-transform:none;letter-spacing:0">
    </div>

    <input type="hidden" id="editId" value="${v.id}">
    <input type="hidden" id="editType" value="${v.type}">
  `;

  const footer = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-accent" onclick="saveEdit()">${ICONS.save} Guardar cambios</button>
  `;

  showModal('Editar vehículo', body, ICONS.edit, footer, null, 'edit-modal');

  // Aplicar validaciones en vivo
  setTimeout(() => {
    const plate = $('#editPlate');
    if (plate) {
      plate.addEventListener('input', e => {
        e.target.value = normalizePlate(e.target.value);
      });
    }
    const phone = $('#editPhone');
    if (phone) {
      phone.addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^\d+]/g, '').slice(0, 15);
      });
    }
    const dayInput = $('#editPaymentDay');
    if (dayInput) {
      dayInput.addEventListener('input', e => {
        let val = e.target.value.replace(/[^\d]/g, '');
        if (val.length > 2) val = val.slice(0, 2);
        const n = parseInt(val);
        if (!isNaN(n) && n > 31) val = '31';
        if (val === '0') val = '1';
        e.target.value = val;
      });
    }
  }, 50);
}

let editSelectedType = null;
function editSetType(type) {
  editSelectedType = type;
  const hidden = $('#editType');
  if (hidden) hidden.value = type;
  // Actualizar botones visualmente
  const buttons = document.querySelectorAll('[data-edit-group="mes"] button');
  const selStyle = 'background:var(--accent);color:#111111;border-color:#111111';
  const txtStyle = 'background:var(--border);color:var(--text);border-color:transparent';
  buttons.forEach(b => {
    b.style.cssText = b.dataset.type === type ? selStyle : txtStyle;
  });
}

function saveEdit() {
  const id = $('#editId')?.value;
  const idx = state.activeMonths.findIndex(x => x.id === id);
  if (idx === -1) return;
  const v = state.activeMonths[idx];

  const plate = normalizePlate($('#editPlate')?.value);
  const name = ($('#editName')?.value || '').trim();
  const phone = ($('#editPhone')?.value || '').replace(/[^\d+]/g, '').trim();
  const paymentDayRaw = $('#editPaymentDay')?.value;
  const amountRaw = $('#editAmount')?.value;
  const type = $('#editType')?.value || v.type;

  if (plate.length < 5) {
    showModal('Atención', 'La placa debe tener al menos 5 caracteres.', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  if (name.length < 2) {
    showModal('Atención', 'Ingrese el nombre del cliente.', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  if (phone.length < 7) {
    showModal('Atención', 'Ingrese un teléfono válido.', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  const paymentDay = parseInt(paymentDayRaw);
  if (isNaN(paymentDay) || paymentDay < 1 || paymentDay > 31) {
    showModal('Atención', 'Ingrese un día de pago válido (1 a 31).', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  const amountNum = Number(amountRaw);
  if (amountRaw === '' || isNaN(amountNum) || amountNum <= 0) {
    showModal('Atención', 'Ingrese el monto mensual.', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }

  // Detectar si cambió el día de pago
  const dayChanged = v.paymentDay !== paymentDay;

  v.plate = plate;
  v.name = name;
  v.phone = phone;
  v.paymentDay = paymentDay;
  v.amount = amountNum;
  v.type = type;

  // Si cambió el día de pago, reiniciar el estado de pago para este mes
  // para que el sistema recalcule
  if (dayChanged) {
    v.lastPaidMonth = null;
  }

  saveState();
  closeModal();
  render();
  showToast('Cambios guardados');
}

function confirmDelete(id) {
  const v = state.activeMonths.find(x => x.id === id);
  if (!v) return;

  const body = `
    <p style="text-align:center;font-size:18px;margin-bottom:8px">
      ¿Seguro que deseas eliminar este vehículo?
    </p>
    <div style="background:var(--border);border-radius:12px;padding:14px;margin-top:12px;text-align:center">
      <div style="font-weight:800;font-size:20px;color:var(--text)">${escapeHtml(v.plate)}</div>
      <div style="font-size:15px;color:var(--text-muted);margin-top:2px">${escapeHtml(v.name || '—')} · ${v.type}</div>
    </div>
    <p style="text-align:center;font-size:14px;color:var(--text-soft);margin-top:14px;font-weight:500">
      Esta acción no se puede deshacer.
    </p>
  `;

  const footer = `
    <button class="btn btn-ghost" onclick="closeModal()">No</button>
    <button class="btn btn-danger" onclick="doDelete('${id}')">${ICONS.trash} Sí, eliminar</button>
  `;

  showModal('Eliminar vehículo', body, ICONS.warn, footer, 'var(--danger-bg)');
}

function doDelete(id) {
  const idx = state.activeMonths.findIndex(x => x.id === id);
  if (idx === -1) return;
  const v = state.activeMonths[idx];
  state.activeMonths.splice(idx, 1);
  state.notifiedToday = state.notifiedToday.filter(x => x !== id);
  saveState();
  closeModal();
  render();
  showToast('Vehículo ' + v.plate + ' eliminado');
}

================================================================== */
function registerMes() {
  const input = $('#plateMes');
  const plate = normalizePlate(input.value);
  const name = ($('#nameMes')?.value || '').trim();
  const phone = ($('#phoneMes')?.value || '').replace(/[^\d+]/g, '').trim();
  const paymentDayRaw = $('#paymentDayMes')?.value;
  const amountRaw = $('#amountMes')?.value;

  if (plate.length < 5) {
    showModal('Atención', 'Ingrese una placa válida (mínimo 5 caracteres).', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  if (name.length < 2) {
    showModal('Atención', 'Ingrese el nombre del cliente.', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  if (phone.length < 7) {
    showModal('Atención', 'Ingrese un teléfono válido (mínimo 7 dígitos).', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  const paymentDay = parseInt(paymentDayRaw);
  if (isNaN(paymentDay) || paymentDay < 1 || paymentDay > 31) {
    showModal('Atención', 'Ingrese un día de pago válido (1 a 31).', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }
  const amountNum = Number(amountRaw);
  if (amountRaw === '' || isNaN(amountNum) || amountNum <= 0) {
    showModal('Atención', 'Ingrese el monto mensual del vehículo.', ICONS.warn, null, 'var(--warn-bg)');
    return;
  }

  state.activeMonths.push({
    id: uid('m'),
    plate,
    type: selectedTypes.mes,
    name,
    phone,
    paymentDay,
    amount: amountNum,
    startDate: new Date().toISOString(),
    lastPaidMonth: null,
    service: 'mes'
  });
  saveState();

  const today = new Date();
  const isToday = (paymentDay === today.getDate());

  if (isToday) {
    setTimeout(() => {
      const p = $('#plateMes'); if (p) p.value = '';
      const n = $('#nameMes'); if (n) n.value = '';
      const t = $('#phoneMes'); if (t) t.value = '';
      const d = $('#paymentDayMes'); if (d) d.value = '';
      const a = $('#amountMes'); if (a) a.value = '';
    }, 50);

    showToast('Registrado · Vence HOY. Redirigiendo a Inicio...');
    setTimeout(() => {
      switchTab('inicio');
      inicioSearchQuery = '';
      render();
    }, 600);
  } else {
    showToast('Mensualidad registrada');
    setTimeout(() => {
      const p = $('#plateMes'); if (p) p.value = '';
      const n = $('#nameMes'); if (n) n.value = '';
      const t = $('#phoneMes'); if (t) t.value = '';
      const d = $('#paymentDayMes'); if (d) d.value = '';
      const a = $('#amountMes'); if (a) a.value = '';
      if (p) p.focus();
    }, 100);
  }
}

function payMonthly(id) {
  const idx = state.activeMonths.findIndex(v => v.id === id);
  if (idx === -1) return;
  const v = state.activeMonths[idx];
  const amount = getMonthlyAmount(v);

  const now = new Date();
  v.lastPaidMonth = monthKey(now);

  state.notifiedToday = state.notifiedToday.filter(x => x !== v.id);

  state.history.unshift({
    id: uid('hist'),
    plate: v.plate,
    type: v.type,
    service: 'Mes (Mensualidad)',
    amount,
    entryTime: fmtDate(Date.now()),
    exitTime: fmtDate(Date.now()),
    duration: '30 Días',
    timestamp: Date.now(),
    customer: v.name || '',
    phone: v.phone || '',
    paymentDay: v.paymentDay || ''
  });

  saveState();
  render();

  const nextDue = getNextDueDate(v);
  const nextDays = getDaysRemaining(nextDue);
  const body = `
    <p style="margin-bottom:16px;text-align:center">Mensualidad renovada para <b>${escapeHtml(v.plate)}</b>${v.name ? ' · ' + escapeHtml(v.name) : ''}.</p>
    <div class="summary-row total"><span class="k">Registrado:</span><span class="v">${fmtMoney(amount)}</span></div>
    <div class="summary-row"><span class="k">Próximo vencimiento:</span><span class="v">${fmtDate(nextDue)}</span></div>
    <div class="summary-row"><span class="k">Días restantes:</span><span class="v">${nextDays} día${nextDays !== 1 ? 's' : ''}</span></div>`;
  showModal('Mensualidad Renovada', body, ICONS.checkCircle);
}

/* ==================================================================
   VISTA: GANANCIAS
================================================================== */
function renderGanancias() {
  const now = new Date();
  const todayStr = fmtDate(now);
  const todayTotal = state.history.filter(i => i.exitTime && i.exitTime.startsWith(todayStr)).reduce((s, i) => s + i.amount, 0);
  const weekAgo = now.getTime() - (7 * 24 * 60 * 60 * 1000);
  const weekTotal = state.history.filter(i => i.timestamp >= weekAgo).reduce((s, i) => s + i.amount, 0);

  const monthMap = {};
  state.history.forEach(i => {
    const d = new Date(i.timestamp);
    const key = d.toLocaleString('es-CO', { month: 'long', year: 'numeric' });
    monthMap[key] = (monthMap[key] || 0) + i.amount;
  });

  let monthList = '';
  const keys = Object.keys(monthMap);
  if (keys.length === 0) {
    monthList = `<p style="font-size:16px;color:var(--text-soft);text-align:center;padding:20px;font-weight:500">Sin registros aún.</p>`;
  } else {
    monthList = keys.map(k => `
      <div style="display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);font-size:17px">
        <span style="font-weight:700;color:var(--text-muted);text-transform:capitalize">${escapeHtml(k)}</span>
        <span style="font-weight:900;color:var(--text)">${fmtMoney(monthMap[k])}</span>
      </div>`).join('');
  }

  return `
    <div class="section-head">
      <h2 class="section-title">Ganancias</h2>
      <p class="section-sub">Resumen financiero del parqueadero.</p>
    </div>
    <div class="stat-card dark" style="margin-bottom:16px">
      <div class="label">${ICONS.sun} Ganancias de Hoy</div>
      <div class="value">${fmtMoney(todayTotal)}</div>
      <div class="sub">${todayStr}</div>
    </div>
    <div class="stat-card" style="margin-bottom:22px">
      <div class="label">${ICONS.week} Últimos 7 días</div>
      <div class="value">${fmtMoney(weekTotal)}</div>
      <div class="sub">Ventana móvil</div>
    </div>
    <div class="card">
      <h3 style="font-size:20px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px;color:var(--text)">
        <span style="color:var(--accent);width:24px;height:24px;display:inline-flex">${ICONS.calendar}</span> Ganancias por Mes
      </h3>
      ${monthList}
    </div>`;
}

/* ==================================================================
   EXPORTAR / IMPORTAR
================================================================== */
function buildBackupBlob() {
  const data = JSON.stringify(state, null, 2);
  return new Blob([data], { type: 'application/json' });
}

function buildBackupFilename() {
  return 'parqueadero_bandera_backup_' + new Date().toISOString().slice(0, 10) + '.json';
}

function exportJSON() {
  const blob = buildBackupBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = buildBackupFilename();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Respaldo descargado');
}

function exportAndEmailJSON() {
  exportJSON();

  const subject = encodeURIComponent('Respaldo Parqueadero Bandera Center - ' + new Date().toLocaleDateString('es-CO'));
  const body = encodeURIComponent(
    'Hola,\n\n' +
    'Adjunto el respaldo de la aplicación Parqueadero Bandera Center.\n\n' +
    'Por favor, adjunta manualmente el archivo JSON que acaba de descargarse en tu dispositivo.\n\n' +
    'Archivo: ' + buildBackupFilename() + '\n' +
    'Fecha: ' + new Date().toLocaleString('es-CO') + '\n\n' +
    'Gracias.'
  );
  const mailto = `mailto:${BACKUP_EMAIL}?subject=${subject}&body=${body}`;

  setTimeout(() => {
    window.location.href = mailto;
    showToast('Correo abierto · Adjunta el archivo descargado');
  }, 400);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && (parsed.activeMonths || parsed.settings)) {
        state = { ...defaultState(), ...parsed };
        if (!state.notifiedToday) state.notifiedToday = [];
        if (!state.settings) state.settings = defaultState().settings;
        if (!state.settings.reminderMessage) state.settings.reminderMessage = DEFAULT_MESSAGE;
        saveState();
        applySettings();
        render();
        showModal('Restauración Exitosa', '<p style="text-align:center;font-size:18px">Los datos se importaron correctamente.</p>', ICONS.checkCircle);
      } else throw new Error('Formato inválido');
    } catch (err) {
      showModal('Error', '<p style="text-align:center;font-size:18px">El archivo JSON no es válido.</p>', ICONS.warn, null, 'var(--danger-bg)');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ==================================================================
   PWA
================================================================== */
function initPWA() {
  try {
    const manifest = {
      name: 'Parqueadero Bandera Center',
      short_name: 'Bandera Center',
      start_url: './',
      display: 'standalone',
      background_color: '#f4f5f7',
      theme_color: '#111111',
      icons: [
        { src: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" fill="#111"/><text x="96" y="125" font-size="100" font-family="Arial" font-weight="bold" fill="#FFCC00" text-anchor="middle">P</text></svg>'), sizes: '192x192', type: 'image/svg+xml' },
        { src: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#111"/><text x="256" y="340" font-size="280" font-family="Arial" font-weight="bold" fill="#FFCC00" text-anchor="middle">P</text></svg>'), sizes: '512x512', type: 'image/svg+xml' }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'pcm-v7';
        self.addEventListener('install', e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET') return;
          e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
            if (resp.ok && resp.type === 'basic') {
              const clone = resp.clone();
              caches.open(CACHE).then(c => c.put(e.request, clone));
            }
            return resp;
          }).catch(() => caches.match(e.request))));
        });`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' })))
        .catch(err => console.warn('SW no registrado:', err));
    }
  } catch (e) { console.warn('PWA init falló:', e); }
}

function initInstallPrompt() {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const dismissed = localStorage.getItem(INSTALL_DISMISS_KEY);
    if (!dismissed) {
      showInstallBanner = true;
      setTimeout(() => { if (showInstallBanner) renderInstallBanner(); }, 800);
    }
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    showInstallBanner = false;
    removeInstallBanner();
    localStorage.setItem(INSTALL_DISMISS_KEY, '1');
    showToast('¡App instalada en tu pantalla de inicio!');
  });

  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    localStorage.setItem(INSTALL_DISMISS_KEY, '1');
  }
}

function renderInstallBanner() {
  if (document.getElementById('installBanner')) return;
  if (!showInstallBanner) return;
  const banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.className = 'install-banner';
  banner.innerHTML = `
    <div class="install-banner-content">
      <div class="install-banner-icon">${ICONS.install}</div>
      <div class="install-banner-text">
        <div class="install-banner-title">Instala esta app</div>
        <div class="install-banner-sub">Acceso rápido desde tu pantalla de inicio</div>
      </div>
    </div>
    <div class="install-banner-actions">
      <button class="install-btn install-btn-ghost" onclick="dismissInstallBanner()">Ahora no</button>
      <button class="install-btn install-btn-primary" onclick="triggerInstall()">Instalar</button>
    </div>
  `;
  document.body.appendChild(banner);
  requestAnimationFrame(() => banner.classList.add('show'));
}

function removeInstallBanner() {
  const banner = document.getElementById('installBanner');
  if (banner) {
    banner.classList.remove('show');
    setTimeout(() => banner.remove(), 300);
  }
}

function dismissInstallBanner() {
  showInstallBanner = false;
  removeInstallBanner();
  localStorage.setItem(INSTALL_DISMISS_KEY, '1');
}

async function triggerInstall() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === 'accepted') showToast('¡Instalando app!');
    else showToast('Instalación cancelada');
    deferredInstallPrompt = null;
    removeInstallBanner();
    showInstallBanner = false;
    return;
  }

  const ua = navigator.userAgent || '';
  const isChrome = /Chrome/.test(ua) && !/Edg/.test(ua);
  const isEdge = /Edg/.test(ua);
  const isSamsung = /SamsungBrowser/.test(ua);
  const isFirefox = /Firefox/.test(ua);
  const isSafari = /Safari/.test(ua) && !/Chrome/.test(ua);

  let instructions = '';
  if (isChrome) {
    instructions = `<ol style="padding-left:20px;margin:10px 0;line-height:1.8"><li>Toca el menú <b>⋮</b> arriba a la derecha</li><li>Selecciona <b>"Instalar aplicación"</b></li><li>Confirma <b>"Instalar"</b></li></ol>`;
  } else if (isEdge) {
    instructions = `<ol style="padding-left:20px;margin:10px 0;line-height:1.8"><li>Toca el menú <b>⋯</b></li><li><b>"Aplicaciones"</b> → <b>"Instalar esta aplicación"</b></li><li>Confirma <b>"Instalar"</b></li></ol>`;
  } else if (isSamsung) {
    instructions = `<ol style="padding-left:20px;margin:10px 0;line-height:1.8"><li>Toca el menú <b>≡</b></li><li><b>"Añadir página a"</b> → <b>"Pantalla de inicio"</b></li><li>Confirma <b>"Añadir"</b></li></ol>`;
  } else if (isFirefox) {
    instructions = `<ol style="padding-left:20px;margin:10px 0;line-height:1.8"><li>Toca el menú <b>⋮</b></li><li>Selecciona <b>"Instalar"</b></li><li>Confirma <b>"Añadir"</b></li></ol>`;
  } else if (isSafari) {
    instructions = `<ol style="padding-left:20px;margin:10px 0;line-height:1.8"><li>Toca <b>Compartir</b> ⬆️</li><li><b>"Añadir a pantalla de inicio"</b></li><li>Confirma <b>"Añadir"</b></li></ol>`;
  } else {
    instructions = `<p style="margin:10px 0;line-height:1.7">Abre el menú del navegador y busca <b>"Añadir a pantalla de inicio"</b> o <b>"Instalar aplicación"</b>.</p>`;
  }

  showModal('Añadir a pantalla de inicio',
    `<p style="line-height:1.6">Para instalar la app en tu pantalla de inicio:</p>${instructions}`,
    ICONS.install);
}

/* ==================================================================
   INICIALIZACIÓN
================================================================== */
function init() {
  loadState();
  applySettings();
  bindGlobalEvents();
  switchTab(state.currentTab || 'inicio');
  initPWA();
  initInstallPrompt();
}

function bindGlobalEvents() {
  $('#btnMenu').addEventListener('click', openDrawer);
  $('#overlay').addEventListener('click', closeDrawer);
  $('#btnCloseDrawer').addEventListener('click', closeDrawer);
  $$('.drawer-item').forEach(btn => {
    btn.addEventListener('click', () => { switchTab(btn.dataset.goto); closeDrawer(); });
  });
  $$('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  $('#modalWrap').addEventListener('click', (e) => {
    if (e.target.id === 'modalWrap') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(); closeDrawer(); }
  });
}
